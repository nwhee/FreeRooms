# Weekly data refresh (docs/specs/FR-3.md; weekly since FR-8, 2026-11-11).
#
# Fetches Banner into public/data/schedule.json (FR-2) and commits it as
# schedule.json at the root of the `data` branch, which the UI reads at runtime
# through NEXT_PUBLIC_DATA_URL. It never deploys and never writes to `main`.
#
# The work is split into three jobs so each token has only the permission it needs:
#   fetch           contents: read   npm ci + fetch (runs third-party npm code, so no write access)
#   publish         contents: write  commits schedule.json to `data` (runs no npm code)
#   calendar-issue  issues: write    opens, updates or closes the `calendar-missing` issue
# `publish` and `calendar-issue` only run when the run publishes: only on main, always
# for the schedule, and for workflow_dispatch only when the `publish` input is true.
# Any other run is a test run that prints what it would have written.
#
# Historical name "nightly-data" (file, workflow name, concurrency group) is kept so
# links, run history and the re-enable path keep working. The schedule is weekly.

name: nightly-data

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 03:00 EST / 04:00 EDT
  workflow_dispatch:
    inputs:
      # Untick for a test run that writes nothing to GitHub (no push to data, no issue change).
      publish: { description: "Push to the data branch and update the calendar issue", type: boolean, default: true }

permissions: {}

concurrency:
  group: nightly-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      calendar_warning_count: ${{ steps.calendar.outputs.count }}
      issue_body: ${{ steps.calendar.outputs.body }}
    steps:
      - name: Check out the triggering ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed the current schedule from the data branch
        id: seed
        run: |
          set -euo pipefail
          status=0
          git ls-remote --exit-code --heads origin data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags --depth=1 origin +refs/heads/data:refs/remotes/origin/data
            mkdir -p public/data
            git show origin/data:schedule.json > public/data/schedule.json
            cp public/data/schedule.json "$RUNNER_TEMP/seed-schedule.json"
            echo "data_branch=present" >> "$GITHUB_OUTPUT"
            echo "Seeded public/data/schedule.json from origin/data."
          elif [ "$status" -eq 2 ]; then
            echo "data_branch=missing" >> "$GITHUB_OUTPUT"
            echo "No data branch yet (first run); skipping the seed."
          else
            echo "::error::git ls-remote failed (exit $status); not guessing whether the data branch exists."
            exit "$status"
          fi

      - name: Fetch data from Banner
        run: npm run fetch-data

      - name: Compare with the seeded copy
        id: compare
        env:
          DATA_BRANCH: ${{ steps.seed.outputs.data_branch }}
        run: |
          set -euo pipefail
          if [ "$DATA_BRANCH" = "missing" ] || ! cmp -s "$RUNNER_TEMP/seed-schedule.json" public/data/schedule.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "schedule.json changed (or the data branch is missing); it will be published."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "schedule.json is unchanged; nothing to publish."
          fi

      - name: Read calendar warnings
        id: calendar
        run: |
          set -euo pipefail
          warnings="$(jq -c '[.warnings[] | select(contains("has no academic calendar file"))]' public/data/schedule.json)"
          count="$(jq 'length' <<< "$warnings")"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body_file="$RUNNER_TEMP/calendar-issue-body.md"
          {
            echo "The weekly data run found terms with no academic calendar file, so no-class days and exam periods are missing for them:"
            echo
            jq -r '.[] | "- " + .' <<< "$warnings"
            echo
            echo 'Fix: add the missing `data/calendar/<YYYY-YYYY>.json` from the registrar PDF (see "Yearly chore" in the README). This issue closes itself on the first run without the warning.'
            echo
            echo "Last updated by run $run_url."
          } > "$body_file"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "count=$count"
            echo "body<<$delimiter"
            cat "$body_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "Calendar warnings: $count"

      - name: Test run (publish false or not main) - print what would be written
        if: ${{ !(github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)) }}
        env:
          CHANGED: ${{ steps.compare.outputs.changed }}
          WARNING_COUNT: ${{ steps.calendar.outputs.count }}
        run: |
          set -euo pipefail
          echo "Test run (publish false, or not on main): skipping the push to the data branch (changed=$CHANGED) and the calendar issue."
          echo "Calendar warnings ($WARNING_COUNT):"
          jq -r '.warnings[] | select(contains("has no academic calendar file"))' public/data/schedule.json
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "Would open or update the 'calendar-missing' issue with this body:"
            echo "----"
            cat "$RUNNER_TEMP/calendar-issue-body.md"
            echo "----"
          else
            echo "Would close the open 'calendar-missing' issue, if there is one."
          fi

      - name: Upload schedule.json for the publish job
        if: steps.compare.outputs.changed == 'true' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schedule
          path: public/data/schedule.json
          if-no-files-found: error
          # Kept 1 day: re-running only the publish job more than a day later finds no
          # artifact, so use "Re-run all jobs" instead.
          retention-days: 1

  publish:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download schedule.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: schedule
          path: ${{ runner.temp }}/schedule

      - name: Commit schedule.json to the data branch
        env:
          DATA_DIR: ${{ runner.temp }}/data-branch
          NEW_FILE: ${{ runner.temp }}/schedule/schedule.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=0
          git ls-remote --exit-code --heads origin data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags --depth=1 origin +refs/heads/data:refs/remotes/origin/data
            git worktree add -B data "$DATA_DIR" origin/data
          elif [ "$status" -eq 2 ]; then
            echo "No data branch yet; creating it as an orphan branch."
            git worktree add --detach "$DATA_DIR"
            git -C "$DATA_DIR" switch --orphan data
          else
            echo "::error::git ls-remote failed (exit $status)."
            exit "$status"
          fi
          cp "$NEW_FILE" "$DATA_DIR/schedule.json"
          cd "$DATA_DIR"
          git add -- schedule.json
          if git diff --cached --quiet; then
            echo "schedule.json already matches the data branch; nothing to commit."
            exit 0
          fi
          git commit -m "data: weekly schedule update ($(TZ=America/New_York date +%F))"
          if ! git push origin data; then
            echo "Push rejected; rebasing onto origin/data and retrying once."
            git pull --rebase origin data
            git push origin data
          fi

  calendar-issue:
    needs: fetch
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open, update or close the calendar-missing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WARNING_COUNT: ${{ needs.fetch.outputs.calendar_warning_count }}
          ISSUE_BODY: ${{ needs.fetch.outputs.issue_body }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/calendar-issue-body.md"
          printf '%s\n' "$ISSUE_BODY" > "$body_file"
          if [ "$WARNING_COUNT" -gt 0 ]; then
            gh label create calendar-missing --force --color D93F0B \
              --description "A term has no academic calendar file in data/calendar/"
          fi
          issue="$(gh issue list --label calendar-missing --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ "$WARNING_COUNT" -gt 0 ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$body_file"
              echo "Updated issue #$issue."
            else
              gh issue create --title "Academic calendar file missing" --label calendar-missing --body-file "$body_file"
            fi
          elif [ -n "$issue" ]; then
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$issue" --comment "Calendar warnings cleared by run $run_url."
            echo "Closed issue #$issue."
          else
            echo "No calendar warnings and no open calendar-missing issue."
          fi
